<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horarios · Buses Región de Murcia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1016;
  --bg-grad:#11151d;
  --panel:#171b23;
  --panel-hi:#1e2430;
  --line:#262c38;
  --amber:#ffab2e;
  --amber-dim:#6b4a13;
  --teal:#33d6c4;
  --text:#eceef2;
  --text-dim:#8b93a4;
  --text-faint:#565e6f;
  --radius:14px;
  --radius-sm:9px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, var(--bg-grad), var(--bg) 60%);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;padding:0 0 40px;min-height:100vh;}

/* header */
header.top{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, rgba(13,16,22,.97) 70%, rgba(13,16,22,0));
  backdrop-filter:blur(6px);
  padding:18px 18px 10px;
}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.brand{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.2px;}
.brand span{color:var(--amber);}
.clock{
  font-family:var(--font-mono);font-weight:600;font-size:15px;color:var(--amber);
  background:#000;border:1px solid var(--amber-dim);border-radius:6px;padding:4px 8px;
  letter-spacing:1px;
}
.tagline{font-size:12.5px;color:var(--text-dim);margin-top:2px;}

/* search */
.searchbar{
  margin-top:14px;position:relative;
}
.searchbar input{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-family:var(--font-body);font-size:15px;padding:12px 40px 12px 14px;border-radius:12px;
  outline:none;transition:border-color .15s;
}
.searchbar input:focus{border-color:var(--amber-dim);}
.searchbar input::placeholder{color:var(--text-faint);}
.searchbar .clr{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;border:none;background:var(--panel-hi);
  color:var(--text-dim);font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center;
}
.searchbar .clr.show{display:flex;}

main{padding:14px 18px 0;}

/* section titles */
.sect-title{
  font-family:var(--font-display);font-size:12.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:1.2px;color:var(--text-faint);margin:20px 2px 10px;display:flex;align-items:center;gap:8px;
}
.sect-title .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);}

/* line grid */
.linegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.linecard{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 10px;cursor:pointer;text-align:center;transition:transform .12s,border-color .12s,background .12s;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.linecard:active{transform:scale(.96);}
.linecard:hover{border-color:var(--line-color,var(--amber-dim));background:var(--panel-hi);}
.badge{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:14px;color:#0d1016;
  background:var(--line-color,#888);
  box-shadow:0 0 0 3px rgba(255,255,255,.04) inset;
}
.linecard .lname{font-size:10.5px;color:var(--text-dim);line-height:1.25;}
.linecard.nodata{opacity:.45;}
.linecard.nodata .badge{filter:grayscale(1);}

/* favorites / results rows */
.rowlist{display:flex;flex-direction:column;gap:8px;}
.stoprow{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:11px 12px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:border-color .12s,background .12s;
}
.stoprow:hover{border-color:var(--line-color,var(--amber-dim));}
.stoprow .mini{
  width:30px;height:30px;min-width:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:10.5px;color:#0d1016;background:var(--line-color,#888);
}
.stoprow .info{flex:1;min-width:0;}
.stoprow .sname{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stoprow .sdir{font-size:11.5px;color:var(--text-dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stoprow .next{
  font-family:var(--font-mono);font-size:12.5px;color:var(--text-faint);text-align:right;white-space:nowrap;
}
.stoprow .next.soon{color:var(--amber);font-weight:600;}
.stoprow .next .lbl{display:block;font-size:9.5px;color:var(--text-faint);font-weight:400;letter-spacing:.4px;text-transform:uppercase;}
.star{
  border:none;background:none;color:var(--text-faint);font-size:17px;cursor:pointer;padding:2px 4px;line-height:1;
}
.star.on{color:var(--amber);}

.empty{color:var(--text-faint);font-size:13.5px;text-align:center;padding:30px 10px;line-height:1.5;}

/* line detail */
.linehead{display:flex;align-items:center;gap:12px;margin-top:4px;}
.backbtn{
  border:none;background:var(--panel);color:var(--text-dim);width:36px;height:36px;border-radius:10px;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
}
.linehead .badge{width:40px;height:40px;font-size:13px;}
.linehead h2{font-family:var(--font-display);font-size:17px;margin:0;font-weight:700;}
.linehead a{font-size:11px;color:var(--text-faint);text-decoration:none;border-bottom:1px dotted var(--text-faint);}

.tabs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.tab{
  padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel);
  color:var(--text-dim);font-size:13px;cursor:pointer;font-weight:500;transition:.12s;
}
.tab.active{background:var(--line-color,var(--amber));color:#0d1016;border-color:transparent;font-weight:700;}
.tab small{display:block;font-size:9.5px;font-weight:400;opacity:.85;}

.stoplist{margin-top:16px;display:flex;flex-direction:column;}
.stopitem{
  padding:13px 2px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;
}
.stopitem:last-child{border-bottom:none;}
.stopitem .head{display:flex;align-items:center;gap:8px;}
.stopitem .idx{
  font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);min-width:18px;
}
.stopitem .sname{font-size:14.5px;font-weight:600;flex:1;}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-left:26px;}
.chip{
  font-family:var(--font-mono);font-size:12.5px;padding:5px 9px;border-radius:7px;
  background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
}
.chip.next{
  background:var(--amber);color:#0d1016;font-weight:700;border-color:transparent;
  box-shadow:0 0 0 3px rgba(255,171,46,.15);
}
.chip.passed{color:var(--text-faint);opacity:.5;}

.notice{
  background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius-sm);
  padding:16px;font-size:13px;color:var(--text-dim);text-align:center;margin-top:16px;line-height:1.5;
}
.notice a{color:var(--amber);}

footer{text-align:center;padding:30px 18px 10px;font-size:11px;color:var(--text-faint);line-height:1.6;}
footer a{color:var(--text-dim);}

@media (min-width:600px){
  .linegrid{grid-template-columns:repeat(4,1fr);}
}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <div>
        <div class="brand">movi<span>bus</span> check</div>
        <div class="tagline">Horarios de líneas interurbanas · Región de Murcia</div>
      </div>
      <div class="clock" id="clock">--:--</div>
    </div>
    <div class="searchbar">
      <input id="search" type="text" placeholder="Buscar parada, ej. Mercadona, Ucam..." autocomplete="off">
      <button class="clr" id="clearSearch">✕</button>
    </div>
  </header>
  <main id="main"></main>
  <footer>
    Datos: movibus.carm.es (CARM) · guardados en local, sin conexión.<br>
    Horarios orientativos, verifica siempre en la web oficial de la línea.
  </footer>
</div>

<script>
/* ---------- setup ---------- */
const LINES = JSON.parse(document.getElementById('raw-data').textContent);
const LINE_ORDER = ["31A","31B","31C","31D","32A","32B","33","34","35","36","36A","36B","36C","37","38"];
const COLORS = {
  "31A":"#3f7cac","31B":"#5b9bd5","31C":"#8a5fbf","31D":"#b07cc6",
  "32A":"#e4572e","32B":"#f3a712","33":"#17bebb","34":"#2e86ab","35":"#c2467e",
  "36":"#6b7280","36A":"#588c7e","36B":"#c1666b","36C":"#d4a24e","37":"#5aa06c","38":"#9b6bb5"
};
const DAYTYPES = ["Lunes a Viernes (laborables)","Sábados (laborables)","Domingos y Festivos"];
const DAYLABEL = {
  "Lunes a Viernes (laborables)":"Laborables",
  "Sábados (laborables)":"Sábados",
  "Domingos y Festivos":"Domingos y fest."
};
const DIRLABEL = {ida:"Ida", vuelta:"Vuelta"};

function todayDayType(){
  const d = new Date().getDay();
  if(d===0) return DAYTYPES[2];
  if(d===6) return DAYTYPES[1];
  return DAYTYPES[0];
}
function nowMinutes(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function timeToMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function fmtDelta(mins){
  if(mins<60) return mins+' min';
  const h=Math.floor(mins/60), m=mins%60;
  return h+'h '+(m?m+'m':'').trim();
}
function norm(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

/* flat index of every stop for search/favorites */
const STOPS = [];
LINE_ORDER.forEach(lid=>{
  const L = LINES[lid];
  ['ida','vuelta'].forEach(dir=>{
    const stops = L[dir] || {};
    Object.keys(stops).forEach((sname, idx)=>{
      STOPS.push({
        line: lid, lineName: L.name, dir, stopName: sname, idx,
        dayTimes: stops[sname].General || {},
        ubicacion: stops[sname].ubicacion || ''
      });
    });
  });
});

/* favorites (persisted in localStorage on real deployments) */
function favKey(s){ return s.line+'|'+s.dir+'|'+s.stopName; }
function getFavs(){
  try{ return JSON.parse(localStorage.getItem('movibus_favs')||'[]'); }catch(e){ return []; }
}
function setFavs(f){
  try{ localStorage.setItem('movibus_favs', JSON.stringify(f)); }catch(e){}
}
function isFav(s){ return getFavs().includes(favKey(s)); }
function toggleFav(s){
  let f = getFavs();
  const k = favKey(s);
  if(f.includes(k)) f = f.filter(x=>x!==k);
  else f.push(k);
  setFavs(f);
}

/* next-departure helper: returns {label, soon, times:[{t,passed,isNext}]} */
function computeTimes(dayTimes, dayType){
  const times = dayTimes[dayType] || [];
  const isToday = dayType === todayDayType();
  const nm = nowMinutes();
  let nextIdx = -1;
  const out = times.map((t,i)=>{
    const mins = timeToMin(t);
    const passed = isToday && mins < nm;
    if(isToday && nextIdx===-1 && mins>=nm) nextIdx = i;
    return {t, mins, passed};
  });
  out.forEach((o,i)=> o.isNext = (i===nextIdx));
  return {times: out, isToday, nextIdx};
}
function nextLabel(dayTimes){
  const dt = todayDayType();
  const {times, isToday, nextIdx} = computeTimes(dayTimes, dt);
  if(!isToday || !dayTimes[dt]) return {text:'—', soon:false, sub: DAYLABEL[dt]+' no aplica hoy'};
  if(nextIdx===-1) return {text:'Sin más buses hoy', soon:false, sub:''};
  const delta = times[nextIdx].mins - nowMinutes();
  return {text: (delta<=1?'Ahora':'en '+fmtDelta(delta)), soon: delta<=15, sub: times[nextIdx].t};
}

/* ---------- state ---------- */
let state = { view:'home', line:null, dir:'ida', dayType: todayDayType(), query:'' };

const mainEl = document.getElementById('main');

const clearBtn = document.getElementById('clearSearch');

searchEl.addEventListener('input', e=>{

  render();
});
clearBtn.addEventListener('click', ()=>{
  searchEl.value=''; state.query=''; clearBtn.classList.remove('show'); render();
});

function goLine(lid, dir, stopName){
  state.query=''; searchEl.value=''; clearBtn.classList.remove('show');

  const L = LINES[lid];
  const avail = availableDayTypes(lid, state.dir);
  state.dayType = avail.includes(todayDayType()) ? todayDayType() : (avail[0]||todayDayType());
  render();
  if(stopName){
    setTimeout(()=>{
      const el = document.querySelector('[data-stop="'+CSS.escape(stopName)+'"]');
      if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('flash'); }
    }, 60);
  }
}
function goHome(){ state.view='home'; state.line=null; render(); }
function availableDayTypes(lid, dir){
  const stops = LINES[lid][dir] || {};
  const set = new Set();
  Object.values(stops).forEach(info=>{
    Object.keys(info.General||{}).forEach(dt=>set.add(dt));
  });
  return DAYTYPES.filter(dt=>set.has(dt));
}

/* ---------- render ---------- */
function render(){
  if(state.query.trim().length>0){
    renderSearch();
  } else if(state.view==='line' && state.line){
    renderLine();
  } else {
    renderHome();
  }
}

function lineBadgeHtml(lid, small){
  const c = COLORS[lid]||'#888';
  return '<div class="badge" style="background:'+c+'">'+lid+'</div>';
}

function renderHome(){
  const favs = getFavs();
  let html = '';
  if(favs.length){
    html += '<div class="sect-title"><span class="dot"></span>Tus paradas</div><div class="rowlist">';
    favs.forEach(k=>{
      const [lid,dir,sname] = k.split('|');
      const L = LINES[lid]; if(!L) return;
      const info = (L[dir]||{})[sname]; if(!info) return;
      html += stopRowHtml({line:lid,lineName:L.name,dir,stopName:sname,dayTimes:info.General||{}}, true);
    });
    html += '</div>';
  }
  html += '<div class="sect-title"><span class="dot"></span>Líneas</div>';
  html += '<div class="linegrid">';
  LINE_ORDER.forEach(lid=>{
    const L = LINES[lid];
    const noData = Object.keys(L.ida).length===0 && Object.keys(L.vuelta).length===0;
    html += '<div class="linecard'+(noData?' nodata':'')+'" style="--line-color:'+COLORS[lid]+'" onclick="goLine(\''+lid+'\')">'
      + lineBadgeHtml(lid)
      + '<div class="lname">'+L.name+'</div>'
      + '</div>';
  });
  html += '</div>';
  mainEl.innerHTML = html;
}

function stopRowHtml(s, showStar){
  const c = COLORS[s.line]||'#888';
  const nl = nextLabel(s.dayTimes);
  const favActive = isFav(s);
  return '<div class="stoprow" style="--line-color:'+c+'" onclick="goLine(\''+s.line+'\',\''+s.dir+'\',decodeURIComponent(\''+encodeURIComponent(s.stopName)+'\'))">'
    + '<div class="mini">'+s.line+'</div>'
    + '<div class="info"><div class="sname">'+s.stopName+'</div><div class="sdir">'+s.lineName+' · '+DIRLABEL[s.dir]+'</div></div>'
    + '<div class="next '+(nl.soon?'soon':'')+'"><span class="lbl">'+(nl.sub||'')+'</span>'+nl.text+'</div>'
    + (showStar!==false ? '<button class="star '+(favActive?'on':'')+'" onclick="event.stopPropagation(); toggleFav({line:\''+s.line+'\',dir:\''+s.dir+'\',stopName:decodeURIComponent(\''+encodeURIComponent(s.stopName)+'\')}); render();">★</button>' : '')
    + '</div>';
}

function renderSearch(){
  const q = norm(state.query.trim());
  const matches = STOPS.filter(s => norm(s.stopName).includes(q) || norm(s.lineName).includes(q) || norm(s.line).includes(q));
  let html = '<div class="sect-title"><span class="dot"></span>'+matches.length+' resultado'+(matches.length!==1?'s':'')+'</div>';
  if(!matches.length){
    html += '<div class="empty">No hay paradas que coincidan con "'+state.query+'".<br>Prueba con otro nombre.</div>';
  } else {
    html += '<div class="rowlist">' + matches.slice(0,60).map(s=>stopRowHtml(s)).join('') + '</div>';
  }
  mainEl.innerHTML = html;
}

function renderLine(){
  const lid = state.line;
  const L = LINES[lid];
  const c = COLORS[lid]||'#888';
  const noData = Object.keys(L.ida).length===0 && Object.keys(L.vuelta).length===0;

  let html = '<div class="linehead">'
    + '<button class="backbtn" onclick="goHome()">←</button>'
    + lineBadgeHtml(lid)
    + '<div><h2>Línea '+lid+'</h2>'
    + (L.url? '<a href="'+L.url+'" target="_blank" rel="noopener">'+L.name+' · web oficial ↗</a>' : '<span style="color:var(--text-dim);font-size:12px">'+L.name+'</span>')
    + '</div></div>';

  if(noData){
    html += '<div class="notice">No tenemos horarios cargados para esta línea todavía.'
      + (L.url? ' Consulta <a href="'+L.url+'" target="_blank" rel="noopener">la web oficial</a>.' : '')
      + '</div>';
    mainEl.innerHTML = html;
    return;
  }

  html += '<div class="tabs">';
  ['ida','vuelta'].forEach(dir=>{
    const stops = L[dir]||{};
    const names = Object.keys(stops);
    const endpoint = names.length ? names[names.length-1].replace(/\s*(I{1,3}|IV)$/,'') : '';
    html += '<div class="tab '+(state.dir===dir?'active':'')+'" style="--line-color:'+c+'" onclick="setDir(\''+dir+'\')">'
      + DIRLABEL[dir] + (endpoint? '<small>→ '+endpoint+'</small>':'') + '</div>';
  });
  html += '</div>';

  const avail = availableDayTypes(lid, state.dir);
  html += '<div class="tabs">';
  avail.forEach(dt=>{
    html += '<div class="tab '+(state.dayType===dt?'active':'')+'" style="--line-color:'+c+'" onclick="setDayType(\''+encodeURIComponent(dt)+'\')">'+DAYLABEL[dt]+'</div>';
  });
  html += '</div>';

  const stops = L[state.dir]||{};
  html += '<div class="stoplist">';
  Object.keys(stops).forEach((sname, i)=>{
    const info = stops[sname];
    const {times} = computeTimes(info.General||{}, state.dayType);
    if(!(info.General||{})[state.dayType]){
      return;
    }
    html += '<div class="stopitem" data-stop="'+sname.replace(/"/g,'&quot;')+'">'
      + '<div class="head"><span class="idx">'+(i+1)+'</span><span class="sname">'+sname+'</span>'
      + '<button class="star '+(isFav({line:lid,dir:state.dir,stopName:sname})?'on':'')+'" onclick="toggleFav({line:\''+lid+'\',dir:\''+state.dir+'\',stopName:decodeURIComponent(\''+encodeURIComponent(sname)+'\')}); render();">★</button>'
      + '</div>'
      + '<div class="chips">'
      + times.map(t=>'<span class="chip '+(t.isNext?'next':'')+(t.passed?' passed':'')+'">'+t.t+'</span>').join('')
      + '</div></div>';
  });
  html += '</div>';

  mainEl.innerHTML = html;
}

function setDir(dir){
  state.dir = dir;
  const avail = availableDayTypes(state.line, dir);
  if(!avail.includes(state.dayType)) state.dayType = avail.includes(todayDayType()) ? todayDayType() : (avail[0]||state.dayType);
  render();
}
function setDayType(encoded){
  state.dayType = decodeURIComponent(encoded);
  render();
}

/* live clock */
function tickClock(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = hh+':'+mm;
}
tickClock();
setInterval(()=>{ tickClock(); render(); }, 30000);

render();
</script>
</body>
</html>
